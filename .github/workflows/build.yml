name: Build Android APK

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Android SDK
      uses: android-actions/setup-android@v3

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v3

    - name: Smart Build Android APK
      run: |
        echo "Searching for project structure..."
        if [ -f "app/build.gradle" ] || [ -f "app/build.gradle.kts" ]; then
          echo "Found project inside 'app' directory."
          cd app
        else
          echo "Using root directory structure."
        fi

        if [ -f "gradlew" ]; then
          chmod +x gradlew
          ./gradlew assembleDebug
        else
          echo "Gradlew not found, generating wrapper..."
          gradle wrapper
          chmod +x gradlew
          ./gradlew assembleDebug
        fi

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: |
          build/outputs/apk/debug/*.apk
          app/build/outputs/apk/debug/*.apk
